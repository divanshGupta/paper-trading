version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src/storage:/app/src/storage  # persist prices.json
    environment:
      - NODE_ENV=production
      - PORT=8080
    env_file:
      - ./backend/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Inside Docker, frontend talks to backend via container name
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8080
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  prices_storage: