app = 'backend-proud-haze-8547'
primary_region = 'sin'

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 150

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = "prices_data"
  destination = "/app/src/storage"  # persists prices.json across deploys